name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.7"
          cache: true

      - name: Build mainnet binary
        run: go build -mod=readonly -tags "netgo objstore pebbledb mainnet" -o /tmp/upsided ./cmd/upsided

      - name: Vet (including the mainnet fork test, which only compiles with its tag)
        run: |
          go vet -tags objstore ./app/... ./x/...
          go vet -tags "objstore pebbledb mainnet mainnetfork" ./app/

      - name: Test
        run: go test -mod=readonly -tags objstore ./...

      - name: Test memiavl
        working-directory: memiavl
        run: go test -mod=readonly -tags objstore ./...

      - name: Test store
        working-directory: store
        run: go test -mod=readonly -tags objstore ./...
