syntax = "proto3";
package upside;

import "gogoproto/gogo.proto";

option go_package = "github.com/0xUp5ide/upside-foundation/x/upside/types";

// Params defines the parameters for the upside module.
message Params {
  option (gogoproto.goproto_stringer) = false;
  string ibc_upside_denom             = 1 [(gogoproto.moretags) = "yaml:\"ibc_upside_denom,omitempty\""];
  uint64 ibc_timeout                  = 2;
  // the admin address who can update token mapping
  string upside_admin           = 3;
  bool   enable_auto_deployment = 4;
  uint64 max_callback_gas       = 5;
  // mint_half_life_seconds is the half-life of the capped supply curve: in
  // each period of this length, x/mint mints half of the tokens still below
  // the 2.1 billion UP cap. Must be at least 31557600 (1 Julian year).
  uint64 mint_half_life_seconds = 6;
  // mint_paused stops x/mint from minting while true: the inflation rate is
  // zero and supply does not change. When it is set back to false, minting
  // resumes along the curve from the supply at that time, so the tokens not
  // minted during the pause are not minted later in one block. Only
  // MsgSetMintPaused changes it; MsgUpdateParams must repeat the stored value.
  bool mint_paused = 7;
}

// TokenMappingChangeProposal defines a proposal to change one token mapping.
message TokenMappingChangeProposal {
  option (gogoproto.goproto_getters)  = false;
  option (gogoproto.goproto_stringer) = false;

  string title       = 1;
  string description = 2;
  string denom       = 3;
  string contract    = 4;
  // only when updating upside (source) tokens
  string symbol  = 5;
  uint32 decimal = 6;
}

// TokenMapping defines a mapping between native denom and contract
message TokenMapping {
  string denom    = 1;
  string contract = 2;
}
